[package]
name = "concurrent"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "concurrent"
path = "src/lib.rs"

[[bin]]
name = "concurrent"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5.56", features = ["cargo"], optional = true }
layout-rs = "0.1.3"
pest = { version = "2.8.3", features = ["miette-error"] }
pest_derive = "2.8.3"
petgraph = "0.8.3"
svg2pdf = { version = "0.13.0", optional = true }
thiserror = "2.0.17"
log = "0.4.22"
wasm-bindgen = { version = "0.2.120", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:svg2pdf"]
web = ["dep:wasm-bindgen"]
